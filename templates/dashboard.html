<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freebox Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  body { background: #0f1115; color: #e6e6e6; font-family: system-ui, sans-serif; font-size: 13px; margin: 0; padding: 16px; }
  h3 { font-size: 14px; margin: 0 0 8px; text-align: center; }
  .card { background: #1a1d24; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; }
  .header span { white-space: nowrap; }
  .ok { color: #2ecc71; font-weight: bold; }
  .ko { color: #e74c3c; font-weight: bold; }
  .stale-badge { color: #f1c40f; font-weight: bold; }
  .header.stale .ok, .header.stale .ko { opacity: 0.4; }
  table { width: auto; margin: 0 auto; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2a2e37; }
  .chart-box { position: relative; height: 260px; }
  .table-wrap { overflow-x: auto; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; margin-bottom: 8px; }
  .btns button { background: #1a1d24; color: #e6e6e6; border: 1px solid #2a2e37; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .btns button:first-child { border-radius: 6px 0 0 6px; }
  .btns button:last-child { border-radius: 0 6px 6px 0; }
  .btns button.active { background: #3498db; border-color: #3498db; color: #fff; }
  .charts { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .charts .card { flex: 1 1 400px; min-width: 0; }
  @media (max-width: 600px) {
    body { padding: 8px; }
    .card { padding: 10px; margin-bottom: 10px; }
    .chart-box { height: 300px; }
    .btns button { padding: 8px 14px; }
    th, td { padding: 6px; }
  }
</style>
</head>
<body>

<div class="card header" id="dashboard-header">
  <span id="hdr-stale" class="stale-badge" style="display:none">DONNEES FIGEES</span>
  <span>Materiel: <b id="hdr-model">-</b></span>
  <span>FreeboxOS: <b id="hdr-firmware">-</b></span>
  <span>Internet: <b id="hdr-internet">-</b></span>
  <span>Authentification: <b id="hdr-auth">-</b></span>
  <span>Telephone: <b id="hdr-phone">-</b></span>
  <span>IPv4: <b id="hdr-ipv4">-</b></span>
  <span>IPv6: <b id="hdr-ipv6">-</b></span>
  <span>Uptime: <b id="hdr-uptime">-</b></span>
  <span>Total: <b id="hdr-total">-</b></span>
  <span>Débit: <b id="hdr-speed">-</b></span>
</div>

<div class="controls">
  <span>Durée du graphique</span>
  <span class="btns" id="range"><button data-s="60" class="active">1 min</button><button data-s="180">3 min</button><button data-s="300">5 min</button></span>
  <span>Rafraîchissement</span>
  <span class="btns" id="refresh"><button data-s="1">1 s</button><button data-s="3">3 s</button><button data-s="5">5 s</button><button data-s="pause">Pause</button></span>
  <span>Échelle vitesse</span>
  <span class="btns" id="scale"><button data-m="linear" class="active">Linéaire</button><button data-m="log">Log</button></span>
  <label><input type="checkbox" id="keep-awake" checked> Garder l'écran allumé</label>
</div>

<div class="charts">
  <div class="card"><div class="chart-box"><canvas id="wan-chart"></canvas></div></div>
  <div class="card"><div class="chart-box"><canvas id="temp-chart"></canvas></div></div>
</div>

<div class="card">
  <h3>Ports</h3>
  <div class="table-wrap">
  <table>
    <thead><tr><th>Port</th><th>Vitesse</th><th>Down</th><th>Up</th><th>Total down</th><th>Total up</th></tr></thead>
    <tbody id="ports-body"></tbody>
  </table>
  </div>
</div>

<div class="card">
  <h3>Appareils</h3>
  <div class="table-wrap">
  <table>
    <thead><tr><th>Nom</th><th>IPv4</th><th>IPv6 locale</th><th>IPv6 globale</th><th>Type</th><th>Constructeur</th></tr></thead>
    <tbody id="devices-body"></tbody>
  </table>
  </div>
</div>

<script>
function fmtBytes(n) {
  if (n == null) return "-";
  const units = ["o", "Ko", "Mo", "Go", "To"];
  let i = 0;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return `${i === 0 ? n : n.toFixed(2)} ${units[i]}`;
}
function fmtMbps(bps) { return ((bps ?? 0) / 1_000_000).toFixed(2) + " Mb/s"; }
function fmtStatus(ok) {
  if (ok === undefined || ok === null) return '<span>-</span>';
  return ok ? '<span class="ok">OK</span>' : '<span class="ko">KO</span>';
}
const TYPE_ICONS = {
  nas: "🗄️", smartphone: "📱", tablet: "📱", workstation: "🖥️", laptop: "💻",
  television: "📺", "set-top_box": "📺", printer: "🖨️", vg_console: "🎮",
  ip_camera: "📷", camera: "📷", ip_phone: "☎️", light: "💡", outlet: "🔌",
  appliances: "🏠", thermostat: "🌡️", networking_device: "📡", repeater: "📡",
  wifi_access_point: "📡", multimedia_device: "🔊", other: "❔",
};
function typeIcon(t) {
  return `<span title="${esc(t)}">${TYPE_ICONS[t] ?? "❔"}</span>`;
}
function esc(s) {
  return String(s ?? "-").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let windowS = 60;
let lastPoints = [];
let logScale = false;
let paused = false;
let pausedAt = 0;
const LOG_FLOOR = 0.001;
const timeAxis = { type: "linear", ticks: { maxTicksLimit: 7, callback: v => new Date(v * 1000).toLocaleTimeString() } };
const chartPlugins = {
  tooltip: { callbacks: { title: items => new Date(items[0].parsed.x * 1000).toLocaleTimeString() } },
  legend: { labels: { usePointStyle: true, pointStyle: "line" } },
};

const maxLabels = {
  id: "maxLabels",
  afterDatasetsDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    const boxes = [];
    ctx.save();
    ctx.font = "12px system-ui, sans-serif";
    ctx.textAlign = "left";
    const pad = 4, h = 18;
    const overlaps = (b, x, y, w) => x < b.x + b.w && b.x < x + w && y < b.y + h && b.y < y + h;
    chart.data.datasets.forEach(ds => {
      if (!ds.data.length) return;
      const peak = ds.data.reduce((a, b) => (b.y > a.y ? b : a));
      const px = scales.x.getPixelForValue(peak.x);
      const py = scales[ds.yAxisID].getPixelForValue(peak.y);
      const text = `${peak.y.toFixed(peak.y < 0.1 ? 3 : 2)} Mb/s`;
      const w = ctx.measureText(text).width + 2 * pad;
      const y = Math.max(py - 8 - h, chartArea.top);
      let x = Math.min(Math.max(px - w / 2, chartArea.left), chartArea.right - w);
      const clash = boxes.find(b => overlaps(b, x, y, w));
      if (clash) {
        x = clash.x + clash.w + 4;
        if (x + w > chartArea.right) x = Math.max(clash.x - w - 4, chartArea.left);
      }
      boxes.push({ x, y, w });
      ctx.fillStyle = ds.borderColor;
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = "#1a1d24";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = ds.borderColor;
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = ds.borderColor;
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + pad, y + h / 2);
    });
    ctx.restore();
  },
};

const avgDownLine = {
  id: "avgDownLine",
  afterDatasetsDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    const down = chart.data.datasets[0];
    const vals = down.data.map(p => p.y).filter(v => v != null);
    if (!vals.length) return;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const y = scales[down.yAxisID].getPixelForValue(avg);

    ctx.save();
    ctx.strokeStyle = down.borderColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(chartArea.left, y);
    ctx.lineTo(chartArea.right, y);
    ctx.stroke();

    ctx.fillStyle = down.borderColor;
    ctx.font = "12px system-ui, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(`${avg.toFixed(avg < 0.1 ? 3 : 2)} Mb/s`, chartArea.left + 4, Math.max(y - 4, chartArea.top + 12));
    ctx.restore();
  },
};

const wanChart = new Chart(document.getElementById("wan-chart"), {
  plugins: [maxLabels, avgDownLine],
  type: "line",
  data: { datasets: [
    { label: "Down (Mb/s)", data: [], yAxisID: "y", borderColor: "#3498db", tension: 0.2 },
    { label: "Up (Mb/s)", data: [], yAxisID: "y1", borderColor: "#e67e22", tension: 0.2 },
  ]},
  options: {
    animation: false, responsive: true, maintainAspectRatio: false, plugins: chartPlugins,
    scales: {
      x: { ...timeAxis },
      y: { type: "linear", position: "left", beginAtZero: true, grace: "30%", title: { display: true, text: "Down (Mb/s)" } },
      y1: { type: "linear", position: "right", beginAtZero: true, grace: "30%", title: { display: true, text: "Up (Mb/s)" }, grid: { drawOnChartArea: false } },
    },
  },
});

const tempChart = new Chart(document.getElementById("temp-chart"), {
  type: "line",
  data: { datasets: [] },
  options: {
    animation: false, responsive: true, maintainAspectRatio: false, plugins: chartPlugins,
    scales: {
      x: { ...timeAxis },
      y: { type: "linear", position: "left", title: { display: true, text: "°C" } },
      y1: { type: "linear", position: "right", title: { display: true, text: "RPM" }, grid: { drawOnChartArea: false } },
    },
  },
});

const TEMP_COLORS = ["#e74c3c", "#f1c40f", "#2ecc71", "#9b59b6", "#1abc9c"];
const FAN_COLORS = ["#3498db", "#e67e22"];

function updateHeader(snap, stale) {
  document.getElementById("hdr-model").textContent = snap.model ?? "-";
  document.getElementById("hdr-firmware").textContent = snap.firmware ?? "-";
  document.getElementById("hdr-internet").innerHTML = fmtStatus(snap.internet_ok);
  document.getElementById("hdr-auth").innerHTML = fmtStatus(snap.auth_ok);
  document.getElementById("hdr-phone").innerHTML = fmtStatus(snap.phone_ok);
  document.getElementById("hdr-ipv4").textContent = snap.ipv4 ?? "-";
  document.getElementById("hdr-ipv6").textContent = snap.ipv6 ?? "-";
  document.getElementById("hdr-uptime").textContent = snap.uptime ?? "-";
  document.getElementById("hdr-total").textContent =
    snap.wan_down_bytes == null ? "-" : `↓ ${fmtBytes(snap.wan_down_bytes)}  ↑ ${fmtBytes(snap.wan_up_bytes)}`;
  document.getElementById("hdr-speed").textContent =
    snap.wan_down_bps == null ? "-" : `↓ ${fmtMbps(snap.wan_down_bps)}  ↑ ${fmtMbps(snap.wan_up_bps)}`;
  document.getElementById("dashboard-header").classList.toggle("stale", !!stale);
  document.getElementById("hdr-stale").style.display = stale ? "" : "none";
}

function updateTables(snap) {
  const portsBody = document.getElementById("ports-body");
  portsBody.innerHTML = (snap.ports ?? []).map(p =>
    `<tr><td>${esc(p.port)}</td><td>${esc(p.speed)}</td><td>${fmtMbps(p.down_bps)}</td><td>${fmtMbps(p.up_bps)}</td><td>${fmtBytes(p.down_bytes)}</td><td>${fmtBytes(p.up_bytes)}</td></tr>`
  ).join("");

  const devicesBody = document.getElementById("devices-body");
  devicesBody.innerHTML = (snap.devices ?? []).map(d =>
    `<tr><td>${esc(d.name)}</td><td>${esc(d.ipv4)}</td><td>${esc(d.ipv6)}</td><td>${esc(d.ipv6_global)}</td><td>${typeIcon(d.type)}</td><td>${esc(d.vendor)}</td></tr>`
  ).join("");
}

function fmtLogTick(v) {
  return v >= 1 ? Math.round(v).toLocaleString() : String(+v.toPrecision(2));
}

function applyWanScales() {
  [["y", 0], ["y1", 1]].forEach(([id, i]) => {
    const scale = wanChart.options.scales[id];
    scale.ticks = { ...scale.ticks, callback: logScale ? fmtLogTick : undefined };
    if (!logScale) {
      Object.assign(scale, { type: "linear", min: undefined, max: undefined, beginAtZero: true, grace: "30%" });
      return;
    }
    // Leave ~20% of the plot height above the peak (in decades) for the value label
    const peak = Math.max(LOG_FLOOR, ...wanChart.data.datasets[i].data.map(p => p.y));
    const decades = Math.max(Math.log10(peak / LOG_FLOOR), 1);
    Object.assign(scale, { type: "logarithmic", min: LOG_FLOOR, max: LOG_FLOOR * 10 ** (decades / 0.8), beginAtZero: false, grace: 0 });
  });
}

function updateCharts(allPoints) {
  lastPoints = allPoints;
  const now = paused ? pausedAt : Date.now() / 1000;
  const points = allPoints.filter(p => p.t >= now - windowS);

  for (const chart of [wanChart, tempChart]) {
    chart.options.scales.x.min = now - windowS;
    chart.options.scales.x.max = now;
  }

  const floor = logScale ? LOG_FLOOR : 0;
  wanChart.data.datasets[0].data = points.map(p => ({ x: p.t, y: Math.max(p.wan_down_bps / 1_000_000, floor) }));
  wanChart.data.datasets[1].data = points.map(p => ({ x: p.t, y: Math.max(p.wan_up_bps / 1_000_000, floor) }));
  applyWanScales();
  wanChart.update();

  const sensorIds = [...new Map(points.flatMap(p => p.sensors ?? []).map(s => [s.id, s.name])).entries()];
  const fanIds = [...new Map(points.flatMap(p => p.fans ?? []).map(f => [f.id, f.name])).entries()];

  tempChart.data.datasets = [
    ...sensorIds.map(([id, name], i) => ({
      label: name, yAxisID: "y", borderColor: TEMP_COLORS[i % TEMP_COLORS.length], tension: 0.2,
      data: points.map(p => ({ x: p.t, y: (p.sensors ?? []).find(s => s.id === id)?.value ?? null })),
    })),
    ...fanIds.map(([id, name], i) => ({
      label: name, yAxisID: "y1", borderColor: FAN_COLORS[i % FAN_COLORS.length], borderDash: [4, 2], tension: 0.2,
      data: points.map(p => ({ x: p.t, y: (p.fans ?? []).find(f => f.id === id)?.value ?? null })),
    })),
  ];
  tempChart.update();
}

function markActive(group, value) {
  for (const b of group.children) b.classList.toggle("active", Number(b.dataset.s) === value);
}

document.getElementById("range").addEventListener("click", e => {
  if (!e.target.dataset.s) return;
  windowS = Number(e.target.dataset.s);
  markActive(e.currentTarget, windowS);
  updateCharts(lastPoints);
});

document.getElementById("scale").addEventListener("click", e => {
  if (!e.target.dataset.m) return;
  logScale = e.target.dataset.m === "log";
  for (const b of e.currentTarget.children) b.classList.toggle("active", b === e.target);
  updateCharts(lastPoints);
});

let refreshS = null;
document.getElementById("refresh").addEventListener("click", async e => {
  if (!e.target.dataset.s) return;
  const group = e.currentTarget;
  if (e.target.dataset.s === "pause") {
    paused = true;
    pausedAt = Date.now() / 1000;
    clearTimeout(tickTimer);
    for (const b of group.children) b.classList.toggle("active", b === e.target);
    return;
  }
  try {
    const r = await fetch("/api/interval", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ interval: Number(e.target.dataset.s) }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    refreshS = (await r.json()).interval;
  } catch (err) {
    console.error(err);
    return;
  }
  paused = false;
  markActive(group, refreshS);
  clearTimeout(tickTimer);
  tick();
});

let tickTimer;
let busy = false;

async function tick() {
  if (busy) return;
  busy = true;
  try {
    const snap = await fetch("/api/snapshot").then(r => r.json());
    const hist = await fetch("/api/history").then(r => r.json());
    if (paused) {
      busy = false;
      return;
    }
    const interval = snap.interval ?? 1;
    if (refreshS === null) {
      refreshS = interval;
      markActive(document.getElementById("refresh"), refreshS);
    }
    const stale = snap.t != null && (Date.now() / 1000 - snap.t) > 3 * Math.max(interval, refreshS);
    updateHeader(snap, stale);
    updateTables(snap);
    updateCharts(hist.points);
  } catch (e) {
    console.error(e);
  }
  busy = false;
  tickTimer = setTimeout(tick, (refreshS ?? 1) * 1000);
}

let wakeLock = null;
const keepAwakeBox = document.getElementById("keep-awake");

async function acquireWakeLock() {
  if (!("wakeLock" in navigator) || !keepAwakeBox.checked || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) {
    console.error(e);
  }
}

if (!("wakeLock" in navigator)) {
  keepAwakeBox.checked = false;
  keepAwakeBox.disabled = true;
  keepAwakeBox.parentElement.title = "Non pris en charge par ce navigateur";
} else {
  keepAwakeBox.addEventListener("change", () => {
    if (keepAwakeBox.checked) acquireWakeLock();
    else wakeLock?.release();
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") acquireWakeLock();
  });
  acquireWakeLock();
}

tick();
</script>
</body>
</html>
